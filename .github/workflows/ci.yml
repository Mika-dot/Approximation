name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Approximation.sln
      - name: Build
        run: dotnet build Approximation.sln --configuration Release --no-restore -warnaserror
      - name: Test executable
        run: dotnet run --project Approximation.Tests/Approximation.Tests.csproj --configuration Release --no-build

  windows-release:
    if: github.event_name == 'pull_request' && github.base_ref == 'feature/universal-symbolic-regression' && startsWith(github.head_ref, 'release/symbolic-regression-v')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Approximation.sln

      - name: Build and test
        shell: pwsh
        run: |
          dotnet build Approximation.sln --configuration Release --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project Approximation.Tests/Approximation.Tests.csproj --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Windows demo EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          dotnet publish Approximation/Approximation.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output artifacts/demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item artifacts/demo/Approximation.exe artifacts/Approximation.exe

      - name: Collect library DLL
        shell: pwsh
        run: |
          Copy-Item ApproximationLib/bin/Release/net8.0/ApproximationLib.dll artifacts/ApproximationLib.dll
          if (Test-Path ApproximationLib/bin/Release/net8.0/ApproximationLib.xml) {
            Copy-Item ApproximationLib/bin/Release/net8.0/ApproximationLib.xml artifacts/ApproximationLib.xml
          }

      - name: Smoke-test published EXE
        shell: pwsh
        run: |
          & ./artifacts/Approximation.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @('artifacts/Approximation.exe', 'artifacts/ApproximationLib.dll')
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
          Get-Content artifacts/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Approximation-symbolic-regression-windows-x64
          path: |
            artifacts/Approximation.exe
            artifacts/ApproximationLib.dll
            artifacts/ApproximationLib.xml
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: symbolic-regression-v0.1.0
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $assets = @(
            'artifacts/Approximation.exe',
            'artifacts/ApproximationLib.dll',
            'artifacts/ApproximationLib.xml',
            'artifacts/SHA256SUMS.txt'
          ) | Where-Object { Test-Path $_ }

          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $env:TAG @assets `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:HEAD_SHA `
              --title 'Approximation Symbolic Regression v0.1.0' `
              --notes-file docs/releases/symbolic-regression-v0.1.0.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
