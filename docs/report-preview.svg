<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Preview of the symbolic regression report</title>
  <desc id="desc">Dark dashboard with model formula, quality metrics, observed versus predicted plot and convergence chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101f35"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="55" y="58" fill="#55e6c1" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="3">APPROXIMATION / MODEL DISCOVERY</text>
  <text x="55" y="105" fill="#edf5ff" font-family="Segoe UI,sans-serif" font-size="38" font-weight="700">Symbolic regression report</text>
  <text x="55" y="145" fill="#a9ffd9" font-family="Consolas,monospace" font-size="22">((x × x) − (2 × x)) + 1</text>
  <g font-family="Segoe UI,sans-serif" filter="url(#shadow)">
    <g transform="translate(55 180)"><rect width="245" height="90" rx="15" fill="#10223a" stroke="#274462"/><text x="18" y="30" fill="#8fa4bf" font-size="12">R²</text><text x="18" y="66" fill="#edf5ff" font-size="28" font-weight="700">0.999999</text></g>
    <g transform="translate(315 180)"><rect width="245" height="90" rx="15" fill="#10223a" stroke="#274462"/><text x="18" y="30" fill="#8fa4bf" font-size="12">RMSE</text><text x="18" y="66" fill="#edf5ff" font-size="28" font-weight="700">1.2e−7</text></g>
    <g transform="translate(575 180)"><rect width="245" height="90" rx="15" fill="#10223a" stroke="#274462"/><text x="18" y="30" fill="#8fa4bf" font-size="12">NODES</text><text x="18" y="66" fill="#edf5ff" font-size="28" font-weight="700">9</text></g>
    <g transform="translate(835 180)"><rect width="310" height="90" rx="15" fill="#10223a" stroke="#274462"/><text x="18" y="30" fill="#8fa4bf" font-size="12">PARETO MODELS</text><text x="18" y="66" fill="#edf5ff" font-size="28" font-weight="700">7 candidates</text></g>
  </g>
  <g transform="translate(55 295)"><rect width="535" height="270" rx="17" fill="#0c1a2e" stroke="#274462"/><text x="22" y="35" fill="#edf5ff" font-family="Segoe UI" font-size="18" font-weight="650">Observed vs predicted</text><path d="M55 225L480 62" stroke="#ffca6a" stroke-width="2" stroke-dasharray="7 7"/><g fill="#7da7ff"><circle cx="80" cy="216" r="5"/><circle cx="130" cy="195" r="5"/><circle cx="185" cy="174" r="5"/><circle cx="235" cy="154" r="5"/><circle cx="290" cy="132" r="5"/><circle cx="345" cy="111" r="5"/><circle cx="400" cy="90" r="5"/><circle cx="460" cy="68" r="5"/></g></g>
  <g transform="translate(610 295)"><rect width="535" height="270" rx="17" fill="#0c1a2e" stroke="#274462"/><text x="22" y="35" fill="#edf5ff" font-family="Segoe UI" font-size="18" font-weight="650">Convergence</text><path d="M50 72 C120 95 150 155 215 170 S310 210 480 224" fill="none" stroke="#55e6c1" stroke-width="4"/><path d="M50 64 C125 100 165 142 220 162 S340 207 480 214" fill="none" stroke="#7da7ff" stroke-width="3" stroke-dasharray="7 7"/></g>
</svg>
